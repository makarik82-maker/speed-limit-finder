name: Check Road Speed

on:
  workflow_dispatch:
    inputs:

      latitude:
        description: "Широта GPS"
        required: true
        type: string

      longitude:
        description: "Долгота GPS"
        required: true
        type: string


jobs:

  check-speed:

    name: Find road and speed

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # 1. Получаем код репозитория
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Устанавливаем Python
      # -------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"
          cache: "pip"


      # -------------------------------------------------------
      # 3. Устанавливаем зависимости
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -------------------------------------------------------
      # 4. Проверяем координаты
      # -------------------------------------------------------

      - name: Show input coordinates
        run: |
          echo "Latitude: ${{ inputs.latitude }}"
          echo "Longitude: ${{ inputs.longitude }}"


      # -------------------------------------------------------
      # 5. Запускаем программу
      # -------------------------------------------------------

      - name: Find road and speed
        run: |
          python src/main.py \
            --latitude "${{ inputs.latitude }}" \
            --longitude "${{ inputs.longitude }}" \
            --output "result.json"


      # -------------------------------------------------------
      # 6. Показываем JSON
      # -------------------------------------------------------

      - name: Show result
        run: |
          echo "========================================"
          echo "RESULT JSON"
          echo "========================================"

          cat result.json


      # -------------------------------------------------------
      # 7. Сохраняем результат как Artifact
      # -------------------------------------------------------

      - name: Upload result
        uses: actions/upload-artifact@v4

        with:
          name: speed-result
          path: result.json
          retention-days: 30